name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-public-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install -r requirements.txt
      - name: Run frozen unit tests
        run: pytest -q
      - name: Verify published result summaries
        run: python scripts/verify_public_results.py
      - name: Check relative Markdown links
        run: python scripts/check_markdown_links.py
      - name: Verify present historical v0.14 files
        run: python scripts/verify_legacy_present_files.py
